name: Build Native APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle + Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.lockfile') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK (compile + assemble)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate keystore + build signed release APK
        working-directory: android
        env:
          # AGP resolves storeFile relative to the :app module dir (android/app/),
          # so generate the keystore there and point KEYSTORE_FILE to it absolutely.
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/android.keystore
          KEYSTORE_PASSWORD: android
          KEYSTORE_ALIAS: naamtaan
          KEY_PASSWORD: android
        run: |
          keytool -genkeypair -v -keystore app/android.keystore -storetype PKCS12 \
            -alias naamtaan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=naamtaan1008, OU=naamtaan1008, O=naamtaan1008, L=Huizhou, ST=Guangdong, C=CN"
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naamtaan1008-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: naamtaan1008-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Tag release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          name: naamtaan1008 ${{ github.ref_name }}
