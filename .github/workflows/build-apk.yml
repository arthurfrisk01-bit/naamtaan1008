name: Build TWA APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -storetype PKCS12 \
            -alias naamtaan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=naamtaan1008, OU=naamtaan1008, O=naamtaan1008, L=Huizhou, ST=Guangdong, C=CN"

      - name: Bubblewrap init
        run: npx --yes @bubblewrap/cli init --manifest twa-manifest.json

      - name: Bubblewrap build
        run: npx --yes @bubblewrap/cli build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naamtaan1008-apk
          path: app-release-signed.apk
          if-no-files-found: error

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
          name: naamtaan1008 ${{ github.ref_name }}
